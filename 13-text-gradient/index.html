<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <link rel="stylesheet" href="../1-0-prospecs/reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimMulgyeol/HakgyoansimMulgyeol.css');
        body, html {background:#f9fffe;}
        main {width:100%; height:100vh; display:flex; flex-flow:column nowrap; justify-content: center; align-items: center;}
        main h1 {
            margin:0 auto; font-weight:700;
            font-family:sans-serif;
            font-size:3rem; text-align: center;
            background:#a5d6d2;
            /* -webkit-이란 각각의 브라우저를 사용하는 사용자가 최신 css를 안정적으로 볼 수 있도록 지원하는 브라우저 엔진 도구 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        main h2 {
            font-family:'Hakgyoansim Mulgyeol';
            text-shadow:0 0 20px rgba(255,255,255,0.2);
            font-size:10rem; text-align: center; font-weight:700; 
            background: url(https://i.pinimg.com/1200x/54/af/71/54af71432b738b5de703f30560d2781d.jpg) center / cover;
            /* (위)background:이미지url 위치 / 크기 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation:title 2s infinite alternate;
        }
        @keyframes title {
            0% {transform:scale(100%);}
            100% {transform:scale(105%);}
        }
        p {width:30px;}
        p img {width:100%;}
        p:nth-child(1) img {}
        footer {position:fixed; bottom:50px; right:50px;}
        footer img {width:24px;}
        footer img:nth-child(1) {margin-right:10px;}
        @keyframes bg-gradient {
            0% {}
            100% {}
        }

    </style>
</head>
<body>
    <main>
        <p><img src="./images/arrow.png" alt=""></p>
        <h1>Soap</h1>
        <h2>비누</h2>
        <p><img src="./images/arrow.png" alt=""></p>
    </main>
    <footer>
        <img src="./images/git.png" alt="">
        <img src="./images/notion.png" alt="">
    </footer>
</body>
</html>
